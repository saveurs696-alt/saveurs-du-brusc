<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Saveurs du Brusc — Restaurant méditerranéen</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&family=Italiana&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<style>
  /* ───────── Palettes ───────── */
  :root[data-palette="olive"]{
    --ink: oklch(22% 0.012 110);
    --ink-soft: oklch(38% 0.018 120);
    --paper: oklch(96.5% 0.012 90);
    --paper-warm: oklch(93% 0.02 85);
    --line: oklch(82% 0.02 100);
    --brand: oklch(38% 0.06 130);     /* olive profond */
    --brand-2: oklch(48% 0.07 125);   /* olive moyen */
    --accent: oklch(58% 0.13 45);     /* terracotta */
    --gold: oklch(72% 0.10 85);
  }
  :root[data-palette="azur"]{
    --ink: oklch(22% 0.018 240);
    --ink-soft: oklch(38% 0.025 230);
    --paper: oklch(97% 0.008 230);
    --paper-warm: oklch(94% 0.012 220);
    --line: oklch(82% 0.018 230);
    --brand: oklch(40% 0.09 235);
    --brand-2: oklch(52% 0.11 230);
    --accent: oklch(62% 0.14 60);
    --gold: oklch(72% 0.10 85);
  }
  :root[data-palette="terre"]{
    --ink: oklch(20% 0.02 40);
    --ink-soft: oklch(38% 0.03 40);
    --paper: oklch(96% 0.018 70);
    --paper-warm: oklch(92% 0.03 65);
    --line: oklch(80% 0.025 60);
    --brand: oklch(36% 0.10 35);
    --brand-2: oklch(48% 0.12 40);
    --accent: oklch(60% 0.13 130);
    --gold: oklch(72% 0.10 85);
  }
  :root[data-palette="nuit"]{
    --ink: oklch(95% 0.005 90);
    --ink-soft: oklch(78% 0.008 90);
    --paper: oklch(16% 0.012 110);
    --paper-warm: oklch(20% 0.015 110);
    --line: oklch(28% 0.012 110);
    --brand: oklch(72% 0.10 90);
    --brand-2: oklch(80% 0.09 90);
    --accent: oklch(65% 0.14 45);
    --gold: oklch(78% 0.11 85);
  }

  /* ───────── Density ───────── */
  :root[data-density="compact"]{
    --pad-section: clamp(48px, 7vw, 96px);
    --pad-block: 18px;
    --gap-grid: 18px;
  }
  :root[data-density="regular"]{
    --pad-section: clamp(72px, 10vw, 140px);
    --pad-block: 26px;
    --gap-grid: 26px;
  }
  :root[data-density="ample"]{
    --pad-section: clamp(96px, 14vw, 200px);
    --pad-block: 36px;
    --gap-grid: 36px;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:var(--paper);
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  img{display:block;max-width:100%}
  .serif{font-family:'Cormorant Garamond',serif;font-weight:400;letter-spacing:.005em}
  .display{font-family:'Italiana',serif;letter-spacing:.02em}
  .mono-eyebrow{
    font-family:'Inter',sans-serif;
    font-size:11px;font-weight:500;
    letter-spacing:.32em;text-transform:uppercase;
    color:var(--brand);
  }

  /* divider with diamond — used as section ornament */
  .divider{
    display:flex;align-items:center;justify-content:center;gap:14px;
    color:var(--brand);opacity:.7;
  }
  .divider::before,.divider::after{
    content:"";height:1px;width:48px;background:currentColor;
  }
  .divider .dot{width:5px;height:5px;background:currentColor;transform:rotate(45deg)}

  /* ───────── TOP BAR ───────── */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 32px;
    color:var(--paper);
    transition:background .4s ease, color .4s ease, padding .4s ease,
               top .4s ease, left .4s ease, right .4s ease,
               border-radius .4s ease, box-shadow .4s ease, backdrop-filter .4s ease;
  }
  .topbar.scrolled{
    background:color-mix(in oklch, var(--paper) 82%, transparent);
    backdrop-filter:blur(18px) saturate(1.4);
    -webkit-backdrop-filter:blur(18px) saturate(1.4);
    color:var(--ink);
    padding:10px 24px;
    top:12px;left:20px;right:20px;
    border-radius:40px;
    box-shadow:0 4px 32px oklch(0% 0 0 / .10), 0 1px 0 var(--line);
  }
  .topbar .left{display:flex;align-items:center;gap:24px;font-size:12px;letter-spacing:.04em}
  .topbar .left span{display:inline-flex;align-items:center;gap:8px;opacity:.9}
  .topbar .right{display:flex;align-items:center;gap:22px;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
  .topbar a{color:inherit;text-decoration:none;position:relative;padding:6px 0}
  .topbar a:hover{color:var(--gold)}
  .topbar a.active{color:var(--gold)}
  .topbar a.active::after{
    content:"";position:absolute;left:50%;bottom:-2px;width:6px;height:6px;
    background:var(--gold);transform:translateX(-50%) rotate(45deg);
  }

  .logo{
    display:flex;flex-direction:column;align-items:center;
    line-height:1;
  }
  .logo .name{
    font-family:'Italiana',serif;font-size:20px;letter-spacing:.18em;
  }
  .logo .sub{
    font-family:'Inter',sans-serif;font-size:9px;letter-spacing:.42em;
    margin-top:4px;opacity:.7;
  }

  /* ───────── HERO ───────── */
  .hero{
    position:relative;height:100vh;min-height:640px;width:100%;
    overflow:hidden;color:#fff;
    display:flex;align-items:center;justify-content:center;
  }
  .hero .bg{
    position:absolute;inset:0;
    background-size:cover;background-position:center;
    transform:scale(1.05);
    transition:transform 8s ease;
  }
  .hero.loaded .bg{transform:scale(1)}
  .hero .veil{
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,.15) 35%, rgba(0,0,0,.55) 100%);
  }
  .hero .content{
    position:relative;z-index:2;text-align:center;padding:0 24px;
    transform:translateY(20px);opacity:0;
    transition:transform 1.2s ease .3s, opacity 1.2s ease .3s;
  }
  .hero.loaded .content{transform:none;opacity:1}
  .hero h1{
    font-family:'Italiana',serif;
    font-size:clamp(54px,8.5vw,128px);
    font-weight:400;line-height:1;margin:0;
    letter-spacing:.02em;
    text-shadow:0 2px 30px rgba(0,0,0,.3);
  }
  .hero .place{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;font-size:clamp(18px,1.7vw,24px);
    margin-top:18px;opacity:.95;
  }
  .hero .meta{
    display:flex;align-items:center;justify-content:center;gap:22px;
    margin-top:28px;font-size:11px;letter-spacing:.32em;text-transform:uppercase;opacity:.85
  }
  .hero .meta .dot{width:4px;height:4px;background:#fff;border-radius:50%;opacity:.6}
  .hero .scroll{
    position:absolute;bottom:32px;left:50%;transform:translateX(-50%);
    z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;
    color:rgba(255,255,255,.85);font-size:10px;letter-spacing:.3em;text-transform:uppercase;
  }
  .hero .scroll .line{
    width:1px;height:48px;background:currentColor;animation:scrolldown 2.4s ease-in-out infinite;
    transform-origin:top;
  }
  @keyframes scrolldown{
    0%{transform:scaleY(0);opacity:0}
    40%{transform:scaleY(1);opacity:1}
    100%{transform:scaleY(1) translateY(48px);opacity:0}
  }

  /* ───────── SECTION COMMON ───────── */
  section{padding:var(--pad-section) 32px}
  .container{max-width:1240px;margin:0 auto}
  .section-title{
    text-align:center;margin-bottom:48px;
  }
  .section-title .eyebrow{margin-bottom:14px;color:var(--brand)}
  .section-title h2{
    font-family:'Italiana',serif;font-weight:400;
    font-size:clamp(36px,4.4vw,64px);line-height:1.05;margin:0 0 14px;
    letter-spacing:.01em;
  }
  .section-title p{
    max-width:560px;margin:18px auto 0;color:var(--ink-soft);
    font-family:'Cormorant Garamond',serif;font-size:20px;font-style:italic;line-height:1.5;
  }

  /* ───────── INTRO STRIP ───────── */
  .intro{
    text-align:center;
    padding:var(--pad-section) 32px calc(var(--pad-section) - 16px);
  }
  .intro .quote{
    font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:clamp(22px,2.4vw,32px);line-height:1.45;
    max-width:780px;margin:24px auto 0;color:var(--ink-soft);
    text-wrap:balance;
  }
  .intro .sig{
    margin-top:30px;font-family:'Italiana',serif;font-size:18px;letter-spacing:.18em;color:var(--brand);
  }

  /* ───────── SPECIALITES (cards grid) ───────── */
  .specs .grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap-grid);
  }
  @media (max-width: 980px){ .specs .grid{grid-template-columns:repeat(2,1fr)} }
  @media (max-width: 540px){ .specs .grid{grid-template-columns:1fr} }

  .card{
    position:relative;overflow:hidden;
    aspect-ratio: 3/4;
    background:var(--paper-warm);
    cursor:pointer;
    isolation:isolate;
  }
  .card .img{
    position:absolute;inset:0;
    background-size:cover;background-position:center;
    transition:transform .9s cubic-bezier(.2,.7,.2,1);
  }
  .card:hover .img{transform:scale(1.06)}
  .card .veil{
    position:absolute;inset:0;
    background:linear-gradient(180deg, transparent 40%, rgba(0,0,0,.65) 100%);
  }
  .card .label{
    position:absolute;left:0;right:0;bottom:0;padding:22px 22px 24px;color:#fff;
    transform:translateY(0);transition:transform .5s ease;
  }
  .card .label .num{
    font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.32em;text-transform:uppercase;
    opacity:.75;
  }
  .card .label .name{
    font-family:'Italiana',serif;font-size:26px;line-height:1.1;margin-top:6px;
    letter-spacing:.02em;
  }
  .card .label .desc{
    font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:15px;line-height:1.4;margin-top:8px;
    max-height:0;opacity:0;overflow:hidden;
    transition:max-height .5s ease, opacity .4s ease, margin-top .5s ease;
  }
  .card:hover .label .desc{max-height:80px;opacity:.92}

  .card.placeholder{
    background:
      repeating-linear-gradient(45deg, var(--paper-warm) 0 12px, oklch(from var(--paper-warm) calc(l - 0.04) c h) 12px 24px);
    display:flex;align-items:center;justify-content:center;
  }
  .card.placeholder .ph{
    font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink-soft);
    text-align:center;padding:0 14px;
  }

  /* ───────── AIOLI SPLIT ───────── */
  .aioli{
    background:var(--paper-warm);
  }
  .aioli .row{
    display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,5vw,80px);align-items:center;
  }
  @media (max-width: 880px){ .aioli .row{grid-template-columns:1fr} }
  .aioli .copy{padding:24px 0}
  .aioli .copy h2{
    font-family:'Italiana',serif;font-weight:400;
    font-size:clamp(40px,5vw,72px);line-height:1.05;margin:18px 0 0;
  }
  .aioli .copy .lead{
    font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:22px;line-height:1.5;color:var(--ink-soft);margin:24px 0 28px;max-width:520px;
  }
  .aioli .copy p{max-width:520px;color:var(--ink-soft)}
  .aioli .visual{
    position:relative;aspect-ratio: 4/5;width:100%;
    background:var(--paper);
    overflow:hidden;
  }
  .aioli .visual .img{
    position:absolute;inset:0;background-size:cover;background-position:center;
  }
  .aioli .visual.placeholder{
    background:
      repeating-linear-gradient(45deg, var(--paper) 0 14px, oklch(from var(--paper) calc(l - 0.04) c h) 14px 28px);
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;
  }
  .aioli .visual.placeholder .ph{
    font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink-soft);text-align:center;padding:0 24px;
  }
  .aioli .visual .frame{
    position:absolute;inset:18px;border:1px solid rgba(255,255,255,.5);pointer-events:none;
  }

  /* ───────── PARALLAX QUOTE STRIP ───────── */
  .strip{
    position:relative;height:520px;color:#fff;display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .strip .bg{
    position:absolute;inset:-10% 0;
    background-size:cover;background-position:center;
    transform:translateY(var(--py,0));
  }
  .strip .veil{position:absolute;inset:0;background:rgba(0,0,0,.45)}
  .strip .card-quote{
    position:relative;z-index:2;
    background:rgba(245,243,235,.96);color:var(--ink);
    padding:clamp(36px,5vw,68px) clamp(36px,6vw,84px);
    max-width:680px;text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,.25);
  }
  .strip .card-quote h3{
    font-family:'Italiana',serif;font-weight:400;
    font-size:clamp(30px,3.5vw,46px);margin:0 0 14px;
  }
  .strip .card-quote p{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;
    color:var(--ink-soft);margin:0;line-height:1.6;
  }

  /* ───────── MENU PREVIEW ───────── */
  .menu .row{
    display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,6vw,96px);
  }
  @media (max-width: 880px){ .menu .row{grid-template-columns:1fr} }
  .menu .col h3{
    font-family:'Italiana',serif;font-weight:400;font-size:28px;letter-spacing:.04em;
    margin:0 0 24px;padding-bottom:12px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
  }
  .menu .col h3 .pill{
    font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.28em;
    color:var(--brand);font-weight:500;
  }
  .menu .item{
    display:grid;grid-template-columns:1fr auto;gap:16px;
    padding:14px 0;border-bottom:1px dashed var(--line);
  }
  .menu .item:last-child{border-bottom:0}
  .menu .item .name{
    font-family:'Cormorant Garamond',serif;font-size:21px;
  }
  .menu .item .desc{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;
    color:var(--ink-soft);margin-top:2px;
  }
  .menu .item .price{
    font-family:'Italiana',serif;font-size:20px;color:var(--brand);
    align-self:start;white-space:nowrap;
  }

  /* ───────── GALLERY ───────── */
  .gallery .grid{
    display:grid;grid-template-columns:repeat(6,1fr);gap:8px;
    grid-auto-rows:120px;
  }
  @media (max-width: 880px){ .gallery .grid{grid-template-columns:repeat(3,1fr)} }
  .tile{position:relative;overflow:hidden;background:var(--paper-warm);cursor:pointer}
  .tile .img{position:absolute;inset:0;background-size:cover;background-position:center;
    transition:transform .8s ease;
    filter:saturate(.95);
  }
  .tile:hover .img{transform:scale(1.05);filter:saturate(1.1)}
  .tile .veil{position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .4s}
  .tile:hover .veil{background:rgba(0,0,0,.18)}
  .tile.placeholder{
    background:
      repeating-linear-gradient(45deg, var(--paper-warm) 0 10px, oklch(from var(--paper-warm) calc(l - 0.04) c h) 10px 20px);
    display:flex;align-items:center;justify-content:center;
  }
  .tile.placeholder .ph{
    font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--ink-soft);text-align:center;
  }
  .t-a{grid-column:span 2;grid-row:span 2}
  .t-b{grid-column:span 2;grid-row:span 1}
  .t-c{grid-column:span 2;grid-row:span 2}
  .t-d{grid-column:span 2;grid-row:span 1}
  .t-e{grid-column:span 3;grid-row:span 2}
  .t-f{grid-column:span 3;grid-row:span 2}

  /* ───────── RESERVATION ───────── */
  .reserve{background:var(--paper-warm)}
  .reserve .form{
    max-width:760px;margin:0 auto;
    background:var(--paper);
    padding:clamp(32px,4vw,56px);
    box-shadow:0 1px 0 var(--line), 0 30px 60px rgba(0,0,0,.06);
  }
  .reserve .grid-form{
    display:grid;grid-template-columns:repeat(2,1fr);gap:18px;
  }
  @media (max-width: 600px){ .reserve .grid-form{grid-template-columns:1fr} }
  .field{display:flex;flex-direction:column;gap:8px}
  .field label{
    font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-soft);
  }
  .field input, .field select{
    appearance:none;-webkit-appearance:none;
    border:0;border-bottom:1px solid var(--line);
    background:transparent;color:var(--ink);
    font-family:'Cormorant Garamond',serif;font-size:18px;
    padding:6px 0 8px;outline:none;
    transition:border-color .3s;
  }
  .field input:focus, .field select:focus{border-color:var(--brand)}
  .reserve .actions{
    margin-top:28px;display:flex;justify-content:center;
  }
  .btn{
    appearance:none;border:1px solid var(--brand);background:transparent;
    color:var(--brand);
    font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.32em;text-transform:uppercase;
    padding:16px 36px;cursor:pointer;
    transition:background .35s ease, color .35s ease, transform .2s ease;
  }
  .btn:hover{background:var(--brand);color:var(--paper)}
  .btn.solid{background:var(--brand);color:var(--paper)}
  .btn.solid:hover{background:var(--brand-2);border-color:var(--brand-2)}

  .reserve .info{
    text-align:center;margin-top:36px;color:var(--ink-soft);
    font-family:'Cormorant Garamond',serif;font-size:18px;font-style:italic;
  }

  /* ───────── FOOTER ───────── */
  footer{
    background:var(--ink);
    color:var(--paper);
    padding: 80px 32px 32px;
  }
  footer .grid-foot{
    max-width:1240px;margin:0 auto;
    display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:48px;
  }
  @media (max-width: 800px){ footer .grid-foot{grid-template-columns:1fr 1fr} }
  footer h4{
    font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.32em;text-transform:uppercase;
    color:var(--gold);margin:0 0 18px;font-weight:600;
  }
  footer .brand .name{
    font-family:'Italiana',serif;font-size:30px;letter-spacing:.14em;
  }
  footer .brand .sub{
    font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.42em;
    margin-top:6px;opacity:.6;
  }
  footer .brand p{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;
    margin:18px 0 0;opacity:.8;max-width:320px;line-height:1.5;
  }
  footer ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
  footer ul li{font-size:13px;opacity:.78}
  footer ul a{color:inherit;text-decoration:none}
  footer ul a:hover{color:var(--gold)}
  footer .legal{
    max-width:1240px;margin:64px auto 0;padding-top:24px;
    border-top:1px solid rgba(255,255,255,.1);
    display:flex;justify-content:space-between;align-items:center;
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.5;
  }

  /* small reveal */
  .reveal{opacity:0;transform:translateY(24px);transition:opacity 1s ease,transform 1s ease}
  .reveal.in{opacity:1;transform:none}

  /* selection */
  ::selection{background:var(--brand);color:var(--paper)}
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
    max-height:calc(100vh - 32px);display:flex;flex-direction:column;
    background:rgba(250,249,247,.78);color:#29261b;
    -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
    border:.5px solid rgba(255,255,255,.6);border-radius:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
    font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}

function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (e.isIntersecting) {e.target.classList.add('in');io.unobserve(e.target);}
      }
    }, { threshold: .12 });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);
}

function useScrolled(threshold = 40) {
  const [s, setS] = useState(false);
  useEffect(() => {
    const onScroll = () => setS(window.scrollY > threshold);
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, [threshold]);
  return s;
}

<style>
  #edit-toolbar{
    position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:10px;
    background:oklch(18% 0.01 110);color:#fff;
    padding:10px 18px;border-radius:40px;
    box-shadow:0 8px 32px oklch(0% 0 0/.35);
    z-index:9999;font-family:'Inter',sans-serif;font-size:13px;
    transition:opacity .3s;
  }
  #edit-toolbar button{
    cursor:pointer;border:none;border-radius:20px;
    padding:6px 16px;font-size:12px;font-weight:500;letter-spacing:.04em;
    transition:background .2s, transform .1s;
  }
  #edit-toolbar button:active{transform:scale(.96)}
  #btn-toggle-edit{background:oklch(72% 0.14 45);color:#fff}
  #btn-toggle-edit.active{background:oklch(55% 0.17 145);color:#fff}
  #btn-download{background:oklch(38% 0.06 130);color:#fff}
  #btn-undo{background:oklch(30% 0.01 110);color:#fff}
  #edit-hint{opacity:.6;font-size:11px;white-space:nowrap}

  body.edit-mode [data-editable]:hover{
    outline:2px dashed oklch(72% 0.14 45);
    outline-offset:3px;
    cursor:text;
    border-radius:3px;
  }
  body.edit-mode [data-editable]:focus{
    outline:2px solid oklch(72% 0.14 45);
    outline-offset:3px;
    border-radius:3px;
    background:oklch(100% 0 0/.06);
  }
  [data-editable]{caret-color:oklch(72% 0.14 45)}
</style>

<div id="edit-toolbar">
  <button id="btn-toggle-edit">✏️ Éditer</button>
  <span id="edit-hint" style="display:none">Cliquez sur un texte pour le modifier</span>
  <button id="btn-undo" style="display:none">↩ Annuler</button>
  <button id="btn-download" style="display:none">⬇️ Télécharger</button>
</div>

<script>
(function(){
  const toolbar   = document.getElementById('edit-toolbar');
  const btnToggle = document.getElementById('btn-toggle-edit');
  const btnUndo   = document.getElementById('btn-undo');
  const btnDl     = document.getElementById('btn-download');
  const hint      = document.getElementById('edit-hint');

  let editMode = false;
  let history  = [];

  /* Tag les éléments éditables une fois React monté */
  function tagEditables(){
    const sel = 'h1,h2,h3,h4,h5,h6,p,span,a,li,blockquote,label';
    document.querySelectorAll('#root ' + sel).forEach(el => {
      if(!el.closest('[contenteditable]') && el.childElementCount === 0){
        el.setAttribute('data-editable','');
      }
    });
  }

  /* Activer / désactiver le mode édition */
  function toggleEdit(){
    editMode = !editMode;
    tagEditables();
    document.body.classList.toggle('edit-mode', editMode);
    btnToggle.textContent = editMode ? '✅ Terminer' : '✏️ Éditer';
    btnToggle.classList.toggle('active', editMode);
    hint.style.display  = editMode ? 'inline' : 'none';
    btnUndo.style.display = editMode ? 'inline' : 'none';
    btnDl.style.display   = editMode ? 'inline' : 'none';

    document.querySelectorAll('[data-editable]').forEach(el => {
      el.contentEditable = editMode ? 'true' : 'false';
      if(editMode){
        el.addEventListener('focus', saveSnapshot, {once:true});
      }
    });
  }

  function saveSnapshot(){
    history.push(document.getElementById('root').innerHTML);
    if(history.length > 30) history.shift();
  }

  btnToggle.addEventListener('click', toggleEdit);

  btnUndo.addEventListener('click', () => {
    if(history.length){
      document.getElementById('root').innerHTML = history.pop();
      tagEditables();
      document.querySelectorAll('[data-editable]').forEach(el => {
        el.contentEditable = 'true';
        el.addEventListener('focus', saveSnapshot, {once:true});
      });
    }
  });

  btnDl.addEventListener('click', () => {
    /* désactiver contenteditable avant l'export */
    document.querySelectorAll('[data-editable]').forEach(el => {
      el.contentEditable = 'false';
      el.removeAttribute('data-editable');
    });
    document.body.classList.remove('edit-mode');

    const html = '<!doctype html>\n' + document.documentElement.outerHTML;

    /* remettre le mode édition */
    setTimeout(()=>{
      tagEditables();
      document.body.classList.add('edit-mode');
      document.querySelectorAll('[data-editable]').forEach(el=>{
        el.contentEditable='true';
        el.addEventListener('focus',saveSnapshot,{once:true});
      });
    }, 100);

    const blob = new Blob([html], {type:'text/html'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Saveurs-du-Brusc.html';
    a.click();
  });
})();
</script>

</body>
